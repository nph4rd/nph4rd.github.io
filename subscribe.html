---
layout: page
title: SUBSCRIPTION
permalink: /subscribe/
---

<p id="subscribe-banner" class="newsletter-banner" hidden></p>

<p id="subscribe-back" hidden>
  <a href="{{ site.baseurl }}/">&larr; Back to blog</a>
</p>

<div id="subscribe-fallback">
  {% include newsletter-form.html %}
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  if (!status) return;

  const messages = {
    confirmed: {
      text: "You're subscribed. Future posts and digests will go to your inbox.",
      kind: 'success',
      hideForm: true
    },
    'check-inbox': {
      text: 'Check your inbox and click the confirmation link to finish subscribing.',
      kind: 'success',
      hideForm: true
    },
    invalid: {
      text: 'That confirmation link is invalid or has expired. Enter your email below for a new one.',
      kind: 'error',
      hideForm: false
    },
    'invalid-email': {
      text: 'Please enter a valid email address.',
      kind: 'error',
      hideForm: false
    },
    error: {
      text: 'Something went wrong while processing your subscription. Please try again.',
      kind: 'error',
      hideForm: false
    }
  };

  const entry = messages[status];
  const banner = document.getElementById('subscribe-banner');
  const back = document.getElementById('subscribe-back');
  const fallback = document.getElementById('subscribe-fallback');
  if (entry && banner) {
    banner.textContent = entry.text;
    banner.className = 'newsletter-banner is-' + entry.kind;
    banner.hidden = false;
    if (entry.hideForm && fallback) fallback.hidden = true;
    if (back) back.hidden = false;
  }
})();
</script>
