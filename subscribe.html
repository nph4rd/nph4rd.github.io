<div id="subscribe-banner" class="newsletter-banner" hidden></div>

<p>
  Drop your email below to get notified whenever I publish a new blog post or digest.
  You'll receive a quick confirmation email first (double opt-in), and every email has a one-click unsubscribe link.
</p>

{% include newsletter-form.html %}

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  if (!status) return;

  const messages = {
    confirmed: {
      text: "You're subscribed! You'll receive future blog posts and digests by email.",
      kind: 'success'
    },
    'check-inbox': {
      text: 'Check your inbox and click the confirmation link to finish subscribing.',
      kind: 'success'
    },
    invalid: {
      text: 'That confirmation link is invalid or has expired. Enter your email below to get a fresh one.',
      kind: 'error'
    },
    'invalid-email': {
      text: 'Please enter a valid email address.',
      kind: 'error'
    },
    error: {
      text: 'Something went wrong while processing your subscription. Please try again.',
      kind: 'error'
    }
  };

  const entry = messages[status];
  const banner = document.getElementById('subscribe-banner');
  if (entry && banner) {
    banner.textContent = entry.text;
    banner.className = 'newsletter-banner is-' + entry.kind;
    banner.hidden = false;
  }
})();
</script>
